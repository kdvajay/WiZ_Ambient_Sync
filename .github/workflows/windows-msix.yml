name: Build Windows MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-msix:
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Kdvajay.WiZAmbientSync' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=8996203F-A5D5-4486-9239-288C30EF9DE1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $makeAppx = Get-ChildItem -Path $sdkBin -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\makeappx\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $makeAppx) { throw "x64 makeappx.exe was not found under $sdkBin" }
          Split-Path $makeAppx.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using $($makeAppx.FullName)"

      - name: Build and package MSIX
        shell: pwsh
        run: .\build-msix.ps1 -BuildExecutables

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: WiZ-Ambient-Sync-MSIX-x64
          path: msix-output/*.msix
          if-no-files-found: error
